<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/static/css/authorization styles/main auth style.css">

    <link rel="stylesheet" href="/static/css/authorization styles/authorization style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">

<body>
<main class="main">
    <div class="form">
        <h1>Login</h1>

        <form id="test_auth_form" action="/token" method="post"> 
            <input type="text" class="user_data_form_el" placeholder="Username" name="username">
            <input type="password" class="user_data_form_el" placeholder="Password" name="password">
        </form>
    
    <p id="error_message" style="color: red; margin: 0px 80px;"></p>
       
    <button id="submit" type="submit" form="test_auth_form">Let's start!</button>

    <div class="reg">
        <p style="display: inline-block" for="to_reg">New to FRPokedex?</p>
        <a href="registration">Sign up!</a>
    </div>
    </div>
    </main>
    <script src="/static/js/convert_JSON.js"></script>
